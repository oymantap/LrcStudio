<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vocalify Studio Pro - ᴹʸᴹᵘˢᶦᶜᴹᵘʸ</title>
    
    <!-- Script & CSS CDN (Updated to more reliable links) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>

    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { background-color: #0f0f0f; color: #f3f4f6; padding: 1.25rem; font-family: sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        /* Fallback jika Tailwind telat load */
        .container-box { max-width: 36rem; margin: auto; background: #181818; padding: 1.25rem; border-radius: 1.5rem; border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="text-gray-100 p-3 sm:p-5">

    <div class="max-w-xl mx-auto bg-[#181818] p-5 rounded-3xl border border-white/10 shadow-2xl relative">
        
        <!-- Header -->
        <div class="flex justify-between items-center mb-5">
            <h2 class="text-green-500 font-bold tracking-wider text-lg uppercase">
                Vocalify <span class="text-white opacity-50 text-xs lowercase">ᴹʸᴹᵘˢᶦᶜᴹᵘʸ</span>
            </h2>
            <button onclick="location.reload()" class="bg-red-500/20 hover:bg-red-500 text-red-500 hover:text-white px-3 py-1 rounded-full text-xs font-bold transition-all">
                <i class="fa-solid fa-rotate"></i> RESET
            </button>
        </div>

        <!-- Inputs -->
        <div class="space-y-3 mb-4">
            <input type="text" id="songTitle" placeholder="Judul Lagu (Wajib)..." 
                class="w-full bg-[#121212] border border-white/10 rounded-xl p-3 text-sm focus:outline-none focus:border-green-500 transition-colors">
            
            <div class="flex items-center justify-center w-full">
                <label class="flex flex-col items-center justify-center w-full h-24 border-2 border-dashed border-white/10 rounded-xl cursor-pointer hover:bg-white/5 transition-all">
                    <div class="flex flex-col items-center justify-center pt-5 pb-6">
                        <i class="fa-solid fa-cloud-arrow-up text-green-500 mb-2"></i>
                        <p class="text-xs text-gray-400">Upload Audio File</p>
                    </div>
                    <input type="file" id="audioUpload" accept="audio/*" class="hidden" />
                </label>
            </div>
        </div>

        <!-- Waveform -->
        <div id="waveform-container" class="bg-black rounded-xl border border-white/5 mb-4 overflow-hidden">
            <div id="waveform"></div>
        </div>

        <!-- Speed Control -->
        <div class="flex items-center gap-4 mb-4 bg-black/30 p-3 rounded-xl border border-white/5">
            <span class="text-[10px] text-gray-400 uppercase tracking-widest min-w-[70px]">Tempo: <b id="speedVal" class="text-green-500">1.0</b>x</span>
            <input type="range" id="speedSlider" min="0.5" max="1.0" step="0.05" value="1.0" 
                class="w-full h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-green-500">
        </div>

        <!-- Display Screen -->
        <div class="bg-[#222] p-6 rounded-2xl mb-4 text-center border-b-2 border-green-500 shadow-inner">
            <div id="currentText" class="text-green-500 font-bold text-lg leading-tight">Siapkan Lagu & Lirik</div>
        </div>

        <!-- Setup Controls -->
        <div id="setupArea" class="grid grid-cols-2 gap-2 mb-4">
            <button onclick="ws.skipBackward(5)" class="bg-[#333] hover:bg-[#444] p-3 rounded-xl text-xs transition-all"><i class="fa-solid fa-backward"></i> -5s</button>
            <button onclick="ws.skipForward(5)" class="bg-[#333] hover:bg-[#444] p-3 rounded-xl text-xs transition-all">+5s <i class="fa-solid fa-forward"></i></button>
            <button id="playPauseBtn" class="bg-blue-600 hover:bg-blue-500 p-3 rounded-xl text-xs font-bold transition-all col-span-2">
                <i class="fa-solid fa-play"></i> PLAY AUDIO
            </button>
            <button id="startBtn" class="bg-green-500 text-black p-3 rounded-xl text-xs font-bold transition-all hover:scale-105 col-span-2">🚀 MULAI SYNC</button>
        </div>

        <textarea id="lyricInput" placeholder="Tempel lirik murni di sini..." 
            class="w-full h-32 bg-[#121212] border border-white/10 rounded-xl p-3 text-sm focus:outline-none focus:border-green-500 mb-4 resize-none custom-scrollbar"></textarea>

        <!-- Sync Controls -->
        <div id="syncArea" style="display:none;" class="space-y-2">
            <!-- Tambahan Tombol Pause Play saat Sync -->
            <div class="grid grid-cols-2 gap-2 mb-2">
                <button id="syncPlayPause" class="bg-yellow-600 hover:bg-yellow-500 p-3 rounded-xl text-[10px] font-bold uppercase">
                    <i class="fa-solid fa-pause"></i> Pause Audio
                </button>
                <button id="instBtn" class="bg-[#333] hover:bg-[#444] p-3 rounded-xl text-[10px] font-bold uppercase">♫ Instrumental</button>
            </div>

            <button id="tapBtn" class="w-full bg-pink-600 hover:bg-pink-500 p-6 rounded-2xl text-xl font-black shadow-lg transition-all active:scale-95 mb-2">TAP LIRIK</button>
            
            <div class="grid grid-cols-2 gap-2">
                <button id="backBtn" class="bg-purple-600 hover:bg-purple-500 p-3 rounded-xl text-xs font-bold text-white"><i class="fa-solid fa-arrow-rotate-left"></i> Mundur 1x</button>
                <button id="undoBtn" class="bg-orange-600 hover:bg-orange-500 p-3 rounded-xl text-xs font-bold text-black"><i class="fa-solid fa-trash-can"></i> Hapus Terakhir</button>
                <button id="restartBtn" class="bg-red-600 hover:bg-red-500 p-3 rounded-xl text-xs font-bold"><i class="fa-solid fa-stop"></i> Ulang Awal</button>
                <button id="downloadBtn" disabled class="bg-blue-600 hover:bg-blue-500 disabled:bg-gray-700 disabled:opacity-50 p-3 rounded-xl text-xs font-bold col-span-1 transition-all cursor-pointer">
                    <i class="fa-solid fa-file-zipper"></i> ZIP
                </button>
            </div>
        </div>

        <!-- Output Box -->
        <div id="result-box" class="mt-4 bg-black p-3 rounded-xl border border-white/5 h-32 overflow-y-auto custom-scrollbar">
            <pre id="output" class="font-mono text-[10px] text-green-400 whitespace-pre-wrap">[LRC DATA]</pre>
        </div>

        <div class="fixed bottom-4 right-4 text-[10px] text-white/20 font-mono pointer-events-none tracking-widest uppercase">
            ᴹʸᴹᵘˢᶦᶜᴹᵘʸ
        </div>
    </div>

<script>
    const ws = WaveSurfer.create({ 
        container: '#waveform', 
        waveColor: '#444', 
        progressColor: '#1DB954', 
        cursorColor: '#fff', 
        height: 70, 
        barWidth: 2, 
        responsive: true 
    });
    
    let lyrics = [];
    let timestamps = []; 
    let currentIndex = 0;
    const OFFSET = 0.20;

    const elements = {
        songTitle: document.getElementById('songTitle'),
        downloadBtn: document.getElementById('downloadBtn'),
        startBtn: document.getElementById('startBtn'),
        tapBtn: document.getElementById('tapBtn'),
        output: document.getElementById('output'),
        currentText: document.getElementById('currentText'),
        syncArea: document.getElementById('syncArea'),
        lyricInput: document.getElementById('lyricInput'),
        backBtn: document.getElementById('backBtn'),
        undoBtn: document.getElementById('undoBtn'),
        playPauseBtn: document.getElementById('playPauseBtn'),
        syncPlayPause: document.getElementById('syncPlayPause'),
        instBtn: document.getElementById('instBtn')
    };

    // Fungsi Toggle Play/Pause Global
    function togglePlay() {
        ws.playPause();
        const isPlaying = ws.isPlaying();
        const icon = isPlaying ? '<i class="fa-solid fa-pause"></i>' : '<i class="fa-solid fa-play"></i>';
        const txt = isPlaying ? ' PAUSE AUDIO' : ' PLAY AUDIO';
        elements.playPauseBtn.innerHTML = icon + txt;
        elements.syncPlayPause.innerHTML = icon + txt;
    }

    elements.playPauseBtn.onclick = togglePlay;
    elements.syncPlayPause.onclick = togglePlay;

    elements.songTitle.oninput = () => {
        elements.downloadBtn.disabled = elements.songTitle.value.trim().length === 0;
    };

    document.getElementById('audioUpload').onchange = (e) => {
        const file = e.target.files[0];
        if (file) ws.load(URL.createObjectURL(file));
    };

    document.getElementById('speedSlider').oninput = (e) => {
        ws.setPlaybackRate(parseFloat(e.target.value));
        document.getElementById('speedVal').innerText = e.target.value;
    };

    elements.startBtn.onclick = () => {
        if (elements.songTitle.value.trim() === "") return alert("Isi judul dulu!");
        const raw = elements.lyricInput.value;
        lyrics = raw.split('\n').map(l => l.trim()).filter(l => l !== "");
        if (lyrics.length === 0) return alert("Isi lirik!");
        
        currentIndex = 0;
        timestamps = [];
        renderLRC();
        elements.syncArea.style.display = "block";
        elements.lyricInput.style.display = "none";
        document.getElementById('setupArea').style.display = "none";
        updateUI();
        ws.setTime(0);
        ws.play();
    };

    document.getElementById('restartBtn').onclick = () => {
        if(confirm("Ulang dari awal?")){
            currentIndex = 0;
            timestamps = [];
            renderLRC();
            updateUI();
            ws.setTime(0);
            ws.play();
        }
    };

    function undoAction() {
        if (timestamps.length > 0) {
            const lastEntry = timestamps.pop();
            if (!lastEntry.isInst) {
                currentIndex = Math.max(0, currentIndex - 1);
            }
            renderLRC();
            updateUI();
        }
    }

    elements.backBtn.onclick = undoAction;
    elements.undoBtn.onclick = undoAction;

    function updateUI() {
        if (currentIndex < lyrics.length) {
            elements.currentText.innerText = lyrics[currentIndex];
            elements.tapBtn.innerText = lyrics[currentIndex];
        } else {
            elements.currentText.innerText = "DONE!";
            elements.tapBtn.innerText = "DONE!";
        }
    }

    function addTime(text, isInst = false) {
        const time = Math.max(0, ws.getCurrentTime() - OFFSET);
        const m = Math.floor(time / 60).toString().padStart(2, '0');
        const s = (time % 60).toFixed(2).padStart(5, '0');
        timestamps.push({ formatted: `[${m}:${s}]${text}`, text: text, isInst: isInst });
        renderLRC();
    }

    function renderLRC() {
        const lrc = timestamps.map(t => t.formatted).join('\n');
        elements.output.innerText = lrc || "[LRC DATA]";
        document.getElementById('result-box').scrollTop = 99999;
    }

    elements.tapBtn.onclick = (e) => {
        e.preventDefault();
        if (currentIndex < lyrics.length) {
            addTime(lyrics[currentIndex], false);
            currentIndex++;
            updateUI();
        }
    };

    elements.instBtn.onclick = (e) => {
        e.preventDefault();
        addTime("♫", true);
    };

    elements.downloadBtn.onclick = async () => {
        const lrcContent = timestamps.map(t => t.formatted).join('\n');
        if (!lrcContent) return alert("Tap lirik dulu!");
        
        let title = elements.songTitle.value.trim().replace(/\s+/g, '_');
        const zip = new JSZip();
        zip.file(title + ".lrc", lrcContent);
        const content = await zip.generateAsync({type: "blob"});

        if (window.BlobBridge) {
            var reader = new FileReader();
            reader.readAsDataURL(content); 
            reader.onloadend = function() {
                var base64data = reader.result.split(',')[1];
                window.BlobBridge.saveBlob(base64data, "application/zip", title + ".zip");
            }
        } else {
            const url = URL.createObjectURL(content);
            const a = document.createElement('a');
            a.href = url;
            a.download = title + ".zip";
            document.body.appendChild(a);
            a.click();
            setTimeout(() => { document.body.removeChild(a); window.URL.revokeObjectURL(url); }, 100);
        }
    };
</script>
</body>
</html>
